<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141E" />
      <stop offset="100%" stop-color="#0B0B0F" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Energy Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Soft Radial Light -->
  <circle cx="32" cy="32" r="18" fill="#10B981" opacity="0.18" filter="url(#glow)" />

  <!-- Stylized Clean Energy Bolt Motif (Centered & Balanced) -->
  <path
    d="M34 11 L19 33 L30 33 L26 53 L45 27 L33 27 Z"
    fill="url(#boltGrad)"
    stroke="#A7F3D0"
    stroke-width="0.5"
    filter="url(#glow)"
  />

  <!-- Clean Energy Particle Accent -->
  <circle cx="45" cy="18" r="2.5" fill="#34D399" opacity="0.85" />
  <circle cx="19" cy="46" r="1.8" fill="#06B6D4" opacity="0.8" />
</svg>
