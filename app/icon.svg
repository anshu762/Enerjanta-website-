<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#08080C" />
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Core Bolt Vibrant Gradient -->
    <linearGradient id="boltGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="35%" stop-color="#34D399" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Secondary Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0B0B0F" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Highlight Gradient -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#cardBg)" />
  
  <!-- Outer Neon Gradient Rim -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="url(#neonBorder)" stroke-width="3.5" />

  <!-- Specular Top Rim Reflection -->
  <path d="M 28 8 Q 64 8 100 8" stroke="url(#specular)" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Ambient Radial Glow Behind Logo Mark -->
  <circle cx="64" cy="64" r="42" fill="url(#ambientGlow)" />

  <!-- Stylized Geometric Enerjanta Energy Emblem -->
  <!-- Fast, sharp, unmistakable clean-energy bolt interlocking with solar geometry -->
  <g transform="translate(64, 64) scale(0.92) translate(-64, -64)">
    <!-- Primary Energy Lightning Bolt -->
    <path
      d="M68 18 L34 62 L58 62 L50 110 L94 54 L66 54 Z"
      fill="url(#boltGradient)"
      stroke="#6EE7B7"
      stroke-width="1.5"
      stroke-linejoin="round"
    />

    <!-- Kinetic Clean Energy Accent Spark - Top Right -->
    <path
      d="M86 28 L91 38 L101 43 L91 48 L86 58 L81 48 L71 43 L81 38 Z"
      fill="url(#accentGrad)"
      opacity="0.95"
    />

    <!-- Community Power Pulse Dot - Bottom Left -->
    <circle cx="35" cy="88" r="4" fill="#38BDF8" opacity="0.9" />
    <circle cx="35" cy="88" r="7" fill="#38BDF8" opacity="0.3" />
  </g>
</svg>